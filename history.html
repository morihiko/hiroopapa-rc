<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', sans-serif;
    background: #f0f4f1;
    color: #1b5e35;
    font-size: 14px;
  }
  header {
    background: linear-gradient(160deg, #1b5e35 0%, #0d3d20 60%, #093319 100%);
    color: white;
    padding: 20px 16px 16px;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 12px rgba(0,0,0,0.3);
    border-bottom: 3px solid #c9a227;
  }
  header h1 {
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 0.05em;
    margin-bottom: 10px;
  }
  header .subtitle {
    font-size: 11px;
    opacity: 0.6;
    margin-bottom: 12px;
  }
  .filter-row {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }
  .filter-btn {
    padding: 5px 12px;
    border-radius: 20px;
    border: 1.5px solid rgba(255,255,255,0.3);
    background: transparent;
    color: white;
    font-size: 11px;
    cursor: pointer;
    transition: all 0.2s;
    font-family: inherit;
  }
  .filter-btn.active, .filter-btn:hover {
    background: white;
    border-color: white;
    color: #1b5e35;
  }

  .month-section {
    margin: 0;
  }
  .month-header {
    background: #1b5e35;
    color: #f0d060; text-shadow: 0 1px 2px rgba(0,0,0,0.4);
    font-size: 12px;
    font-weight: 700;
    padding: 6px 16px;
    letter-spacing: 0.1em;
    position: sticky;
    top: var(--header-h, 130px);
    z-index: 90;
  }

  .cards-container {
    padding: 10px 12px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .card {
    background: white;
    border-radius: 12px;
    padding: 14px;
    box-shadow: 0 1px 6px rgba(0,0,0,0.08);
    border-left: 4px solid #ccc;
    transition: all 0.15s;
  }
  .card:active { opacity: 0.85; }

  /* カテゴリ別カラー */
  .card.ロード  { border-left-color: #4c9be8; }
  .card.トレラン { border-left-color: #5cb85c; }
  .card.トラ   { border-left-color: #e67e22; }
  .card.イベント { border-left-color: #9b59b6; }
  .card.その他  { border-left-color: #95a5a6; }

  .card-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    margin-bottom: 8px;
    gap: 8px;
  }
  .card-date {
    font-size: 12px;
    color: #666;
    white-space: nowrap;
    padding-top: 2px;
  }
  .card-badge {
    display: inline-block;
    font-size: 10px;
    padding: 2px 8px;
    border-radius: 10px;
    font-weight: 600;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .badge-ロード   { background: #dbeeff; color: #2471c8; }
  .badge-トレラン { background: #d4edda; color: #276928; }
  .badge-トラ    { background: #fde8d0; color: #c0560b; }
  .badge-イベント { background: #ede0f5; color: #7b3ba0; }
  .badge-その他  { background: #ecf0f1; color: #7f8c8d; }

  .card-title {
    font-size: 15px;
    font-weight: 700;
    color: #1b5e35;
    line-height: 1.35;
    margin-bottom: 7px;
  }
  .card-desc {
    font-size: 12px;
    color: #555;
    line-height: 1.6;
    margin-bottom: 8px;
  }
  .card-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    flex-wrap: wrap;
  }
  .card-members {
    font-size: 11px;
    color: #888;
    flex: 1;
  }
  .card-link {
    font-size: 11px;
    color: #1b5e35;
    text-decoration: none;
    border: 1px solid #1b5e35;
    border-radius: 6px;
    padding: 3px 10px;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .card-link:active { background: #d0eadb; }

  .card-memory {
    font-size: 11px;
    color: #5a4a00;
    background: #fdf8e8;
    border-left: 3px solid #c9a227;
    border-radius: 0 6px 6px 0;
    padding: 5px 9px;
    margin-top: 7px;
    line-height: 1.65;
    font-style: italic;
  }
  .card-memory::before {
    content: '💭 ';
    font-style: normal;
  }


  .badge-推奨 { background: linear-gradient(135deg,#c9a227,#e8c84a); color: #1b1a00; }
  .card.recommended { box-shadow: 0 2px 14px rgba(201,162,39,0.35); }
  .card.recommended::before { content:''; display:block; position:absolute; inset:0; border-radius:12px; border:1.5px solid rgba(201,162,39,0.5); pointer-events:none; }
  .card { position:relative; }
  .hidden { display: none !important; }

  .disclaimer {
    background: #fff8e1;
    border-bottom: 1px solid #e8d88a;
    padding: 8px 14px;
    font-size: 11px;
    color: #7a6000;
    line-height: 1.6;
  }

  .legend {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    padding: 10px 12px;
    background: white;
    border-bottom: 1px solid #e0e0e0;
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 11px;
    color: #555;
  }
  .legend-dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .dot-ロード   { background: #4c9be8; }
  .dot-トレラン { background: #5cb85c; }
  .dot-トラ    { background: #e67e22; }
  .dot-イベント { background: #9b59b6; }
  .dot-その他  { background: #95a5a6; }

  .count-badge {
    background: #e74c3c;
    color: white;
    border-radius: 10px;
    font-size: 10px;
    padding: 1px 6px;
    margin-left: 6px;
  }
  footer {
    text-align: center;
    padding: 20px;
    font-size: 11px;
    color: #8aab98;
  }

  .header-inner { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
  .header-text { flex: 1; }
  .hg-emblem { flex-shrink: 0; }
  header h1 { margin-bottom: 4px; }
</style>

, "m": 6, "d": 13, "fy": 2026, "date": "6/13(土)", "est": false, "cat": "イベント", "title": "京都ランイベント", "desc": "野さん企画。嵐山（渡月橋）→東山、京都マラソンコースに沿って22-24km。飲み会は池田屋跡地の居酒屋案。「安売り系居酒屋にロマンくじかれた」。", "members": "野さん（企画）、チチさん、宮さん など", "memory": "「安売り系居酒屋にロマンをくじかれた」という野さんの報告が笑いを誘った。", "rec": "", "link": "", "story": "", "hl": []}, {"id": "20260614-66", "y": 2026, "m": 6, "d": 14, "fy": 2026, "date": "6/14(日)", "est": false, "cat": "その他", "title": "東京タワー階段競走 🗼", "desc": "階段部の年間メインレース。「ハセツネや富士山より急斜度で厳しい闘い」（しんのすけ）。", "members": "しんのすけ、他階段部", "memory": "完走報告とともに、部内ヒエラルキー図で「階段部が最上位」であることが反省会で発表された。", "rec": "", "link": "", "story": "", "hl": []}, {"id": "20260620-67", "y": 2026, "m": 6, "d": 20, "fy": 2026, "date": "6/20(土)-21(日)", "est": false, "cat": "トレラン", "title": "Kaga Spa Trail 100K/50K", "desc": "雨のドロンコ大会。さわさん100kmリベンジ完走（水中ウォーキング練の男）。加納さん初56km完走、チチさん50km完走。武さんは関門アウトも「痺れる悪夢を泣きながら楽しんだ」。", "members": "さわさん（100k完走）、加納（56k）、チチさん（50k）、武さん、小船井さん（50k）", "memory": "武さん「20回近く転んで関門アウト。夢のような10時間の最後尾単独走」。転倒で紛失したクマスプレーとフラスクはスイーパーが回収して手元に戻った。", "rec": "", "link": "", "story": "", "hl": []}, {"id": "20260621-63", "y": 2026, "m": 6, "d": 21, "fy": 2026, "date": "6/21(日)", "est": false, "cat": "トラ", "title": "木更津トライアスロン", "desc": "チーム名「広尾ＴＣ」。トライアスロン部デビュー戦の人も。木更津はオールドルーキーのサウナホテルあり。", "members": "おださん、はやさん、天さん など", "memory": "早朝の豪雨でスイムもバイクも中止。急遽設けられたランコースは運営も距離が分からないまま「とりあえずスタート」。足首まで浸かる水たまりをバシャバシャ走り、トライアスロンなのに「まさかの7kmラン」で終了。TOSSYさんが「ランもスキップしばりだったらスキップトライアスロンだった」と言った。", "rec": "", "link": "", "story": "", "hl": []}, {"id": "20260628-68", "y": 2026, "m": 6, "d": 28, "fy": 2026, "date": "6/28(日)", "est": false, "cat": "ロード", "title": "サロマ湖100kmウルトラ", "desc": "「ウルトラの父」坂さんが単騎参戦。昨年の60km関門から今年は79.3km関門まで前進。完走メダルは来年に持ち越し。", "members": "坂さん（79.3km）", "memory": "一歩ずつ前進する挑戦に部内総員リスペクト。たじー「来年はもう20km進んでゴールですね🤗」、かけさん「来年は一緒に走ろう」。", "rec": "", "link": "", "story": "", "hl": []}, {"id": "20260628-69", "y": 2026, "m": 6, "d": 28, "fy": 2026, "date": "6/28(日)", "est": false, "cat": "その他", "title": "伊東OWS（オープンウォーター）", "desc": "伊東オレンジビーチ開催。ぐっさん750m、武さんファミリーが1500m。松田丈志・萩野公介らゲスト参加のガチ大会ながら初心者に優しい運営。", "members": "ぐっさん、武さんファミリー", "memory": "武さん「左に娘を、右に息子を見ながら泳いできました。やっぱ海はいいよね」。駅徒歩5分・帰りは温泉と食べ歩き、東京駅8:30〜17:30で完結。", "rec": "", "link": "", "story": "", "hl": []}, {"id": "20260719-72", "y": 2026, "m": 7, "d": 19, "fy": 2026, "date": "7/19(日)", "est": false, "cat": "トレラン", "title": "マウンテントレイルin野沢温泉", "desc": "ラン部最大の遠征「親父の夏合宿」。14km/37km/65km＋ペア・駅伝。7/18(土)-20(月祝)の2泊3日・新幹線遠征（東京8:41発はくたか555号）。費用ザックリ5万円。池畑選手も参加。", "members": "ごーちゃん（65k完走）、チチさん、ナベさん、及さん、Yutaka、ヒロ、リーガー（37k）、みやっち（37k）、たかS（14k・初トレイル）、しげさん（14k）、かけさん、たくちゃん（初大会）、舛田さん ほか多数", "memory": "かけさんの名指し勧誘祭りが3月から続いた。「野沢温泉トレイル37キロは初心者・中級者向け。完走後のシェフのカップヌードルはサイコー！」。みやっち「完走する可能性0%くらいの想定です」で勢いエントリー。", "rec": "⭐ トレイル推奨", "link": "https://nozawaonsen-trail.com/", "story": "", "hl": []}, {"id": "20260724-70", "y": 2026, "m": 7, "d": 24, "fy": 2026, "date": "7/24(金)", "est": false, "cat": "トレラン", "title": "富士登山競走（第79回）", "desc": "平日開催の日本一の山岳レース。五合目コース2時間20分クリアで翌年山頂コースへ。今年はしんちゃんが山頂コースを完走し、グランドスラム（サブ3＋サブ10＋山頂完走）を達成🏆 キンさんは山頂コースで本八合目まで、たじー・松さんは五合目コースに挑戦。", "members": "しんちゃん（山頂完走・グランドスラム達成）、キンさん、たじー、松さん", "memory": "", "rec": "", "link": "https://fujimountainrace.city.fujiyoshida.yamanashi.jp/", "story": "", "hl": []}, {"id": "20260725-71", "y": 2026, "m": 7, "d": 25, "fy": 2026, "date": "7/25(土)", "est": false, "cat": "その他", "title": "スパルタンレース＠富士裾野", "desc": "富士山麓での障害物レース。千葉ドイツ村に続くスパルタン第2弾。", "members": "内藤さん、小串さん（完走）、緒さん（引率）", "memory": "", "rec": "", "link": "https://spartanracejapan.jp/", "story": "", "hl": []}, {"id": "20260726-73", "y": 2026, "m": 7, "d": 26, "fy": 2026, "date": "7/26(日)", "est": false, "cat": "イベント", "title": "H1学年企画ラン（やまびこ打線・第1弾）", "desc": "しんぼっち部長肝いりの学年企画・第1弾。猛暑の国立競技場周辺を8km超ファンラン→森のビアガーデンで懇親会。途中出入り自由、走り始めたばかりのお父さんも参加。", "members": "H1幹事（くーさん）、しんぼっち、しんちゃん、たくちゃん、菅井さん など", "memory": "", "rec": "", "link": "", "story": "", "hl": []}, {"id": "20260806-75", "y": 2026, "m": 8, "d": 6, "fy": 2026, "date": "8/6(木)", "est": false, "cat": "その他", "title": "HYROX＠幕張", "desc": "ファンクショナルフィットネスレース。ランと筋トレ系ワークアウトを組み合わせた新スタイル競技。", "members": "緒さん、他", "memory": "", "rec": "", "link": "https://hyrox.com/event/hyrox-tokyo/", "story": "", "hl": []}, {"id": "20260809-74", "y": 2026, "m": 8, "d": 9, "fy": 2026, "date": "8/9(日)", "est": false, "cat": "トラ", "title": "IRONMAN 70.3 Cebu 🌏", "desc": "おださん・ひろやん発起の海外遠征。気温27-34℃の灼熱レース、ウェットスーツ不可。広尾パパ5名が全員無事完走。8/20の反省会で報告動画を上映。", "members": "おださん、ひろやん、はやさん、まいく、天さん（全員完走）", "memory": "", "rec": "", "link": "https://www.ironman.com/races/im703-cebu-philippines", "story": "部として初の海外遠征。高波でスイムが1.9km→1.0kmに短縮、体感39℃の中それぞれのゴールへ。", "hl": ["広尾親父トライアスロン部 初の海外遠征", "「その赴任が僕たちの冒険の入口になった」", "世界49カ国から集うトライアスリート", "マニラからひろやん合流", "体感気温39℃、強風？高波？", "「波、高！ウェットない 制限時間厳しい」", "高波のためスイム1.9km→1.0km", "「ゴーグルを拭いたら世界がクリアに！」", "他クラブの仲間がゴール", "天さんゴール", "「僕でもゴールできそう」", "おださん 体調不良でDNF、夜に無事復活", "レース翌日「おだツアーズ」", "ジンベエザメと泳ぐ", "「次は、一緒に！」"]}, {"id": "20260809-76", "y": 2026, "m": 8, "d": 9, "fy": 2026, "date": "8/9(日)", "est": false, "cat": "その他", "title": "三浦スイカOWS", "desc": "三浦半島でのオープンウォータースイミング。ゴール後にスイカ食べ放題。IRONMAN Cebu組とは別動隊。「いっぱい泳げてスイカ食べ放題だよ🍉」（天さん）。", "members": "緒さん（リレー）、ぐっさん、篠さん、三上さん、武さんファミリー、山田さん・佐々木さん（年代別1位）など", "memory": "", "rec": "", "link": "", "story": "", "hl": []}, {"id": "20260816-77", "y": 2026, "m": 8, "d": 16, "fy": 2026, "date": "8/16(日)", "est": false, "cat": "イベント", "title": "ブリバラン（夏の陣）", "desc": "たっちー企画の鎌倉・逗子ファンラン。トレイル込み約15km→稲村ヶ崎温泉→BREEZE BIRD CAFEでパーティの黄金コース。2月の逗子シリーズに続く開催。", "members": "たっちー（企画）、しんぼっち、三さん、渡さん、つるさん など", "memory": "", "rec": "", "link": "", "story": "", "hl": []}, {"id": "20260828-78", "y": 2026, "m": 8, "d": 28, "fy": 2026, "date": "8/28(金)-30(日)", "est": false, "cat": "トレラン", "title": "UTMB Mont-Blanc（シャモニー）", "desc": "今年は5名の広尾親父がモンブランへ。たじー（2年連続）とボブさいが完走、もっちー・ごーちゃん・いっしーも挑戦。ラン部から寄せ書きした日の丸とネパール国旗を持って走った。ゴールの瞬間はライブ映像でみんなで見守った。", "members": "たじー（完走）、ボブさい（完走）、もっちー、ごーちゃん、いっしー", "memory": "", "rec": "", "link": "https://montblanc.utmb.world/", "story": "", "hl": []}, {"id": "20260830-79", "y": 2026, "m": 8, "d": 30, "fy": 2026, "date": "8/30(日)", "est": false, "cat": "ロード", "title": "北海道マラソン", "desc": "道産子3人＋野さん。エイドのちくわパン論争が白熱。「ちくわ＝北海道のソウルフード」は道産子坂さんも「見たことない」。", "members": "Nobu、坂さん、及さん、野さん", "memory": "", "rec": "", "link": "https://hokkaido-marathon.com/", "story": "", "hl": []}, {"id": "20260904-81", "y": 2026, "m": 9, "d": 4, "fy": 2026, "date": "9/4(金)夜-5(土)", "est": false, "cat": "イベント", "title": "トレラン親父の富士登山②（池畑選手回）", "desc": "たじー企画・夏の富士登山第2弾。吉田口五合目から山頂へ、ゲストは池畑拓哉選手（3年連続UTMB日本人1位）。雨上がりの山頂まで無事登頂🗻 お鉢巡りと富士山カレー。", "members": "たじー（企画）、池畑選手、はやさん、たくちゃん、他", "memory": "", "rec": "", "link": "", "story": "", "hl": []}, {"id": "20260905-80", "y": 2026, "m": 9, "d": 5, "fy": 2026, "date": "9/5(土)", "est": false, "cat": "ロード", "title": "第128回・TAMAハーフマラソン", "desc": "きらさん＆篠さんのカムバックラン成功🔥 松さんは最後のデッドヒートを制して3位入賞🥉（特典の次回無料で10/10の二子玉川30kmへ）。三さんが並走。", "members": "松さん（3位）、きらさん、篠さん、三さん など", "memory": "三さん情報：TAMAハーフは各部3位以内に入賞すると次回無料。夏場はガチ勢がオフなので入賞が狙える穴場。10月〜3月はペーサー募集もある。", "rec": "", "link": "https://runnet.jp/entry/runtes/user/pc/moshicomDetailAction.do?raceId=138398&div=1", "story": "", "hl": []}, {"id": "20260906-82", "y": 2026, "m": 9, "d": 6, "fy": 2026, "date": "9/6(日)", "est": false, "cat": "トラ", "title": "佐渡国際トライアスロン", "desc": "国内最長級のロングディスタンス。天さんが昨年のリベンジでAタイプに挑戦。", "members": "天さん（Aタイプ）", "memory": "", "rec": "", "link": "http://www.scsf.jp/triathlon/", "story": "", "hl": []}]</script>
<script>
(function(){
  var DATA = JSON.parse(document.getElementById('history-data').textContent);
  var state = { cat:'全て', q:'', fy:'all', desc:true, vonly:false };
  var list = document.getElementById('list');
  var WD = ['日','月','火','水','木','金','土'];

  function esc(s){ return String(s||'').replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
  function mmss(t){ return Math.floor(t/60)+':'+('0'+(t%60)).slice(-2); }
  function at(url,t){ if(!url || url.indexOf('/shorts/')>-1) return ''; return url+(url.indexOf('?')>-1?'&':'?')+'t='+t; }
  function hay(e){
    return [e.title,e.desc,e.story,e.members,e.memory,
      e.hl.join(' ')].join(' ').toLowerCase();
  }
  DATA.forEach(function(e){ e._h = hay(e); e._sceneH = e.hl.join(' ').toLowerCase(); });

  // 年度の選択肢
  var fys = {}; DATA.forEach(function(e){ fys[e.fy]=1; });
  var sel = document.getElementById('fy');
  Object.keys(fys).sort().reverse().forEach(function(y){
    var o=document.createElement('option'); o.value=y; o.textContent=(y==='0'?'時期不明':y+'年度'); sel.appendChild(o);
  });

  function cardHTML(e, qHit){
    var h = '<div class="card '+esc(e.cat)+(e.rec?' recommended':'')+'">';
    h += '<div class="card-top"><div class="card-date">'+esc(e.date)+(e.est?' <span class="est">推定</span>':'')+'</div><span class="card-badge badge-'+esc(e.cat)+'">'+esc(e.cat==='トラ'?'トライアスロン':e.cat)+'</span></div>';
    if(e.rec) h += '<span class="card-badge badge-推奨">'+esc(e.rec)+'</span>';
    h += '<div class="card-title">'+esc(e.title)+'</div>';
    if(e.desc) h += '<div class="card-desc">'+esc(e.desc)+'</div>';
    if(e.story) h += '<div class="card-story">'+esc(e.story)+'</div>';
    if(e.memory) h += '<div class="card-memory">'+esc(e.memory)+'</div>';
    if(e.hl.length){
      h += '<details class="scenes"'+(qHit?' open':'')+'><summary>✨ ハイライト（'+e.hl.length+'場面）</summary><ol class="hl">';
      e.hl.forEach(function(c){
        var hit = state.q && c.toLowerCase().indexOf(state.q)>-1;
        h += '<li'+(hit?' class="hit"':'')+'>'+esc(c)+'</li>';
      });
      h += '</ol></details>';
    }
    if(e.members || e.link){
      h += '<div class="card-footer"><div class="card-members">'+(e.members?'👥 '+esc(e.members):'')+'</div>';
      if(e.link) h += '<a href="'+esc(e.link)+'" class="card-link" target="_blank" rel="noopener">公式サイト</a>';
      h += '</div>';
    }
    return h + '</div>';
  }

  function render(){
    var rows = DATA.filter(function(e){
      if(state.cat!=='全て' && e.cat!==state.cat) return false;
      if(state.fy!=='all' && String(e.fy)!==state.fy) return false;
      if(state.vonly && !e.hl.length) return false;
      if(state.q && e._h.indexOf(state.q)<0) return false;
      return true;
    });
    rows.sort(function(a,b){
      var ka=a.y*10000+(a.m||0)*100+(a.d||99), kb=b.y*10000+(b.m||0)*100+(b.d||99);
      return state.desc ? kb-ka : ka-kb;
    });
    var html='', cur='';
    rows.forEach(function(e){
      var key = !e.y ? '時期不明' : (e.m ? e.y+'年'+e.m+'月' : e.y+'年（月不明）');
      if(key!==cur){
        if(cur) html += '</div></div>';
        html += '<div class="month-section"><div class="month-header">'+key+'</div><div class="cards-container">';
        cur = key;
      }
      html += cardHTML(e, state.q && e._sceneH.indexOf(state.q)>-1);
    });
    if(cur) html += '</div></div>';
    list.innerHTML = html;
    document.getElementById('empty').hidden = rows.length>0;
    var nv = rows.filter(function(e){return e.hl.length;}).length;
    document.getElementById('count').textContent = '表示 '+rows.length+'件（ハイライトあり '+nv+'件）';
  }

  var all = DATA.length, allv = DATA.filter(function(e){return e.hl.length;}).length;
  var withY = DATA.filter(function(e){return e.y;}); var first = withY[0], last = withY[withY.length-1];
  document.getElementById('subtitle').textContent = first.y+'年〜'+last.y+'年'+last.m+'月 ｜ 全 '+all+' 件 ｜ ハイライト '+allv+' 件';

  document.querySelectorAll('#cat-row .filter-btn').forEach(function(btn){
    btn.addEventListener('click', function(){
      document.querySelectorAll('#cat-row .filter-btn').forEach(function(b){ b.classList.remove('active'); });
      btn.classList.add('active'); state.cat = btn.dataset.cat; render();
    });
  });
  var qEl = document.getElementById('q'), timer;
  qEl.addEventListener('input', function(){ clearTimeout(timer); timer=setTimeout(function(){ state.q = qEl.value.trim().toLowerCase(); render(); }, 150); });
  sel.addEventListener('change', function(){ state.fy = sel.value; render(); });
  var sortBtn = document.getElementById('sort');
  sortBtn.addEventListener('click', function(){ state.desc=!state.desc; sortBtn.textContent = state.desc?'↓新しい順':'↑古い順'; render(); window.scrollTo({top:0}); });
  var vBtn = document.getElementById('vonly');
  vBtn.addEventListener('click', function(){ state.vonly=!state.vonly; vBtn.setAttribute('aria-pressed', state.vonly); vBtn.classList.toggle('active', state.vonly); render(); });

  try { var p = new URLSearchParams(location.search).get('q'); if(p){ qEl.value=p; state.q=p.toLowerCase(); } } catch(err){}

  function setHeaderHeight(){ document.documentElement.style.setProperty('--header-h', document.querySelector('header').offsetHeight+'px'); }
  setHeaderHeight(); window.addEventListener('resize', setHeaderHeight);
  render();
})();
</script>

<script>
(function(){
  var PASS='0530';
  var KEY='hg-rc-auth';
  if(sessionStorage.getItem(KEY)==='1'){
    document.getElementById('auth-overlay').style.display='none';
  }
  document.getElementById('pw-input').addEventListener('keydown',function(e){
    if(e.key==='Enter')checkPw();
  });
  window.checkPw=function(){
    var v=document.getElementById('pw-input').value;
    if(v===PASS){
      sessionStorage.setItem(KEY,'1');
      document.getElementById('auth-overlay').style.display='none';
    } else {
      document.getElementById('pw-err').style.display='block';
      document.getElementById('pw-input').value='';
      document.getElementById('pw-input').focus();
    }
  };
})();
</script>
