name = "hiroopapa-rc-bot"
main = "worker.js"
compatibility_date = "2026-10-01"

# 公開してよい設定値。鍵と合言葉は `wrangler secret put` で入れる（README参照）
[vars]
SITE_BASE = "https://morihiko.github.io/hiroopapa-rc/"
ALLOWED_ORIGINS = "https://morihiko.github.io"
MODEL = "claude-haiku-5-5"
DAILY_LIMIT = "100"

# 質問数の数え上げと知識ベースの置き場。id は `wrangler kv namespace create CHAT_KV` の出力で置き換える
[[kv_namespaces]]
binding = "CHAT_KV"
id = "3ac2a5d9cb52469a8b19f694dc7a20d5"

[observability]
enabled = true
